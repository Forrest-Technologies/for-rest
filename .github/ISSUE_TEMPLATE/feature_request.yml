name: Feature request
description: Propose an improvement to For-Rest
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that For-Rest makes hard or impossible today?
      placeholder: "When I ... I have to ... because ..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see? If it touches the .frs language, sketch the syntax you'd want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you've tried, or other ways this could be solved.
