name: Windows MAUI Build

on:
  push:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-maui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: windows-latest
    outputs:
      build_configuration: ${{ steps.version.outputs.build_configuration }}
      version_label: ${{ steps.version.outputs.version_label }}
      app_display_version: ${{ steps.version.outputs.app_display_version }}
      app_version: ${{ steps.version.outputs.app_version }}
      file_version: ${{ steps.version.outputs.file_version }}
      build_timestamp_utc: ${{ steps.version.outputs.build_timestamp_utc }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_title: ${{ steps.version.outputs.release_title }}
    steps:
      - name: Compute branch version metadata
        id: version
        shell: pwsh
        run: |
          $timeZone = [System.TimeZoneInfo]::FindSystemTimeZoneById('Eastern Standard Time')
          $now = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $timeZone)
          $dateLabel = $now.ToString('yyyy-MM-dd')
          $appDisplayVersion = $now.ToString('yyyy.M.d')
          $appVersion = $now.ToString('yyyyMMdd')
          $fileVersion = $now.ToString('yyyy.M.d') + '.0'
          $buildTimestampUtc = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')

          if ('${{ github.ref_name }}' -eq 'master') {
            $buildConfiguration = 'Release'
            $versionLabel = $dateLabel
          }
          else {
            $buildConfiguration = 'Debug'
            $versionLabel = "$dateLabel-beta"
          }

          "build_configuration=$buildConfiguration" >> $env:GITHUB_OUTPUT
          "version_label=$versionLabel" >> $env:GITHUB_OUTPUT
          "app_display_version=$appDisplayVersion" >> $env:GITHUB_OUTPUT
          "app_version=$appVersion" >> $env:GITHUB_OUTPUT
          "file_version=$fileVersion" >> $env:GITHUB_OUTPUT
          "build_timestamp_utc=$buildTimestampUtc" >> $env:GITHUB_OUTPUT
          "release_tag=v$versionLabel" >> $env:GITHUB_OUTPUT
          "release_title=ForRest $versionLabel" >> $env:GITHUB_OUTPUT

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: win-x64
            runner: windows-latest
            platform: x64
            runtime_identifier: win-x64
          - arch: win-arm64
            runner: windows-latest
            platform: ARM64
            runtime_identifier: win-arm64
    runs-on: ${{ matrix.runner }}
    env:
      WINDOWS_TFM: net10.0-windows10.0.19041.0
      WINDOWS_ONLY_BUILD: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          dotnet-quality: preview
          global-json-file: global.json

      - name: Show .NET environment
        shell: pwsh
        run: |
          dotnet --info
          dotnet --list-sdks

      - name: Restore workloads
        shell: pwsh
        run: dotnet workload restore src/ForRest.Maui/ForRest.Maui.csproj -p:ForRestWindowsOnly=$env:WINDOWS_ONLY_BUILD

      - name: Run core unit tests
        shell: pwsh
        run: dotnet test tests/ForRest.Tests/ForRest.Tests.csproj -c Debug

      - name: Run MAUI unit tests
        shell: pwsh
        run: dotnet test tests/ForRest.Maui.Tests/ForRest.Maui.Tests.csproj -c Debug

      - name: Build licensing function
        shell: pwsh
        run: dotnet build src/ForRest.Licensing.Functions/ForRest.Licensing.Functions.csproj -c "${{ needs.prepare.outputs.build_configuration }}"

      - name: Publish licensing admin tool
        shell: pwsh
        run: dotnet publish src/ForRest.Licensing.Tool/ForRest.Licensing.Tool.csproj -c "${{ needs.prepare.outputs.build_configuration }}" -o artifacts/licensing-tool

      - name: Restore Windows app (deterministic assets)
        shell: pwsh
        run: |
          # Explicitly restore the full ForRest.Maui graph for the exact Windows
          # TFM/RID before publishing. Earlier steps (dotnet test on the
          # net10.0-windows ForRest.Maui.Tests, plus the licensing build/publish)
          # restore parts of the project graph; pinning a fresh restore here with
          # the same ForRestWindowsOnly + RID flags guarantees every
          # obj/project.assets.json targets this TFM and rules out NETSDK1005
          # ("assets file doesn't have a target for net10.0") at publish time.
          dotnet restore src/ForRest.Maui/ForRest.Maui.csproj `
            -p:ForRestWindowsOnly=$env:WINDOWS_ONLY_BUILD `
            -r ${{ matrix.runtime_identifier }}

      - name: Publish Windows app
        shell: pwsh
        run: |
          # `dotnet publish` (not `build`) is required so every transitive
          # PackageReference from indirectly-referenced projects — including
          # Microsoft.Extensions.AI*, Microsoft.Agents.AI.OpenAI, Azure.AI.OpenAI,
          # OpenAI, etc. brought in via ForRest.Services — actually lands in
          # the output folder. With `dotnet build`, runtime-specific package
          # assets aren't reliably flowed into the bin output for MAUI's
          # Windows TFM, which produced FileNotFoundException at runtime
          # the first time the AI feature was used.
          $outputDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts\ci\${{ matrix.arch }}"
          dotnet publish src/ForRest.Maui/ForRest.Maui.csproj `
            -c "${{ needs.prepare.outputs.build_configuration }}" `
            -f $env:WINDOWS_TFM `
            -r ${{ matrix.runtime_identifier }} `
            --self-contained false `
            -p:ForRestWindowsOnly=$env:WINDOWS_ONLY_BUILD `
            -p:ContinuousIntegrationBuild=true `
            -p:Platform=${{ matrix.platform }} `
            -p:RuntimeIdentifier=${{ matrix.runtime_identifier }} `
            -p:ApplicationDisplayVersion=${{ needs.prepare.outputs.app_display_version }} `
            -p:ApplicationVersion=${{ needs.prepare.outputs.app_version }} `
            -p:Version="${{ needs.prepare.outputs.version_label }}" `
            -p:InformationalVersion="${{ needs.prepare.outputs.version_label }}" `
            -p:FileVersion=${{ needs.prepare.outputs.file_version }} `
            -p:AssemblyVersion=${{ needs.prepare.outputs.file_version }} `
            -p:ForRestBuildDateUtc=${{ needs.prepare.outputs.build_timestamp_utc }} `
            -p:ForRestLicenseServiceBaseUrl="${{ vars.FORREST_LICENSE_SERVICE_BASE_URL }}" `
            -p:ForRestLicenseIssuer="${{ vars.FORREST_LICENSE_ISSUER }}" `
            -p:ForRestLicenseAudience="${{ vars.FORREST_LICENSE_AUDIENCE }}" `
            -p:ForRestLicenseSigningPublicKeyPem="${{ vars.FORREST_LICENSE_SIGNING_PUBLIC_KEY_PEM }}" `
            -p:ForRestLicenseBuildGraceDays="${{ vars.FORREST_LICENSE_BUILD_GRACE_DAYS }}" `
            -p:ForRestLicenseOfflineLeaseDays="${{ vars.FORREST_LICENSE_OFFLINE_LEASE_DAYS }}" `
            -p:ForRestLicenseRefreshIntervalDays="${{ vars.FORREST_LICENSE_REFRESH_INTERVAL_DAYS }}" `
            -p:ForRestLicenseClockSkewMinutes="${{ vars.FORREST_LICENSE_CLOCK_SKEW_MINUTES }}" `
            -p:ForRestLicenseMaxActivations="${{ vars.FORREST_LICENSE_MAX_ACTIVATIONS }}" `
            -o $outputDirectory

          $aiAssemblyCheck = Get-ChildItem -Path $outputDirectory -Filter 'Microsoft.Extensions.AI*.dll' -File -ErrorAction SilentlyContinue
          if (-not $aiAssemblyCheck) {
            throw "Publish output is missing Microsoft.Extensions.AI*.dll under $outputDirectory. The MAUI Windows publish did not flow the AI package assemblies into the artifact."
          }

      - name: Restore local tools
        if: needs.prepare.outputs.build_configuration == 'Release'
        shell: pwsh
        run: dotnet tool restore

      - name: Obfuscate release assemblies
        if: needs.prepare.outputs.build_configuration == 'Release'
        shell: pwsh
        run: |
          $inputDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts\ci\${{ matrix.arch }}"
          $mappingPath = Join-Path $env:GITHUB_WORKSPACE "artifacts\obfuscation-maps\${{ matrix.arch }}\ForRest.Obfuscar.Mapping.xml"
          & scripts\Invoke-ForRestObfuscation.ps1 `
            -InputDirectory $inputDirectory `
            -OutputDirectory $inputDirectory `
            -KeepPublicApi `
            -MappingOutputPath $mappingPath

      - name: Verify publish output
        shell: pwsh
        run: |
          # Do NOT pre-zip the publish folder here. actions/upload-artifact
          # always compresses whatever it is given into the downloadable
          # artifact, so handing it a .zip produces a zip-inside-a-zip. When
          # users extract that nested archive, Windows Explorer reports the
          # inner zip as "invalid or password protected". Uploading the raw
          # publish folder instead lets GitHub produce exactly one zip. The
          # bare ForRest.Maui.exe is intentionally shipped inside that folder
          # (a MAUI/WinUI apphost cannot run without its sibling files), not
          # as a standalone asset.
          $buildDirectory = Join-Path $env:GITHUB_WORKSPACE "artifacts\ci\${{ matrix.arch }}"
          $exePath = Join-Path $buildDirectory 'ForRest.Maui.exe'
          if (-not (Test-Path $exePath)) {
            throw "Expected executable was not found at $exePath."
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: for-rest-${{ needs.prepare.outputs.version_label }}-${{ matrix.arch }}
          path: artifacts/ci/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 3

      - name: Upload obfuscation mapping
        if: needs.prepare.outputs.build_configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: for-rest-${{ needs.prepare.outputs.version_label }}-${{ matrix.arch }}-obfuscation-map
          path: artifacts/obfuscation-maps/${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 3

      - name: Upload licensing admin tool
        if: matrix.arch == 'win-x64'
        uses: actions/upload-artifact@v4
        with:
          name: for-rest-${{ needs.prepare.outputs.version_label }}-licensing-tool
          path: artifacts/licensing-tool/*
          if-no-files-found: error
          retention-days: 3

  release:
    if: github.ref_name == 'master'
    needs:
      - prepare
      - build
    runs-on: windows-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/downloaded

      - name: Assemble release assets
        shell: pwsh
        run: |
          # download-artifact unwraps each artifact into its own subfolder
          # named after the artifact, leaving the raw publish files. Compress
          # each subfolder into a single, properly named .zip so every release
          # asset is exactly one zip deep (no nested archives) and the app
          # folders are not attached as dozens of loose DLLs.
          $downloaded = Join-Path $env:GITHUB_WORKSPACE 'artifacts\downloaded'
          $assetsDirectory = Join-Path $env:GITHUB_WORKSPACE 'artifacts\release-assets'
          New-Item -ItemType Directory -Force -Path $assetsDirectory | Out-Null

          Get-ChildItem -Path $downloaded -Directory | ForEach-Object {
            $zipPath = Join-Path $assetsDirectory "$($_.Name).zip"
            if (Test-Path $zipPath) {
              Remove-Item $zipPath -Force
            }
            Compress-Archive -Path (Join-Path $_.FullName '*') -DestinationPath $zipPath
          }

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ needs.prepare.outputs.release_tag }}'
          $title = '${{ needs.prepare.outputs.release_title }}'
          $assets = Get-ChildItem -Path (Join-Path $env:GITHUB_WORKSPACE 'artifacts\release-assets') -File | Select-Object -ExpandProperty FullName
          if (-not $assets) {
            throw 'No release assets were downloaded.'
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $tag @assets --clobber
            & gh release edit $tag --title $title
          }
          else {
            & gh release create $tag @assets --title $title --generate-notes
          }
