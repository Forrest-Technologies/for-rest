name: Housekeeping

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  prune-actions-storage:
    runs-on: ubuntu-latest
    steps:
      - name: Delete caches older than 7 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cutoff="$(date -u -d '7 days ago' +%s)"
          gh cache list --repo ${{ github.repository }} --json id,key,createdAt --limit 100 | \
            jq -r --argjson cutoff "$cutoff" \
              '.[] | select((.createdAt | fromdateiso8601) < $cutoff) | .id' | \
            while read -r id; do
              echo "Deleting cache $id"
              gh cache delete "$id" --repo ${{ github.repository }} || true
            done
